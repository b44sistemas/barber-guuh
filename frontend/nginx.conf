server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Habilita compressão gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Proxy reverso da API para o container barber-api na VPS
    location /api/ {
        proxy_pass http://barber-api:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Suporte para rotas SPA (Single Page Application)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cabeçalhos especiais para PWA Service Worker e Manifest
    location /sw.js {
        add_header Cache-Control "no-cache";
        add_header Service-Worker-Allowed "/";
    }

    location ~* \.(manifest|webmanifest|json)$ {
        add_header Cache-Control "no-cache";
    }

    # Cache de imagens e estilos estáticos
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
}
