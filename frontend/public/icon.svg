<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0b0f19"/>
    </radialGradient>
  </defs>
  <!-- Background Circle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <!-- Gold Border Accent -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#goldGrad)" stroke-width="8" opacity="0.4"/>
  
  <!-- Barber Pole & Scissors Icon -->
  <g transform="translate(256, 256)">
    <!-- Scissor Blades (Crossed) -->
    <!-- Blade 1 -->
    <path d="M -120 -130 L 100 110" stroke="url(#goldGrad)" stroke-width="24" stroke-linecap="round"/>
    <circle cx="-130" cy="-140" r="42" fill="none" stroke="url(#goldGrad)" stroke-width="20"/>
    
    <!-- Blade 2 -->
    <path d="M 120 -130 L -100 110" stroke="url(#goldGrad)" stroke-width="24" stroke-linecap="round"/>
    <circle cx="130" cy="-140" r="42" fill="none" stroke="url(#goldGrad)" stroke-width="20"/>
    
    <!-- Center Pivot Pivot -->
    <circle cx="0" cy="-10" r="16" fill="#f59e0b" stroke="#0b0f19" stroke-width="6"/>

    <!-- Barber Comb Base -->
    <path d="M -90 120 Q 0 160 90 120" stroke="#f59e0b" stroke-width="14" fill="none" stroke-linecap="round"/>
    <line x1="-70" y1="135" x2="-70" y2="175" stroke="#f59e0b" stroke-width="10" stroke-linecap="round"/>
    <line x1="-35" y1="145" x2="-35" y2="185" stroke="#f59e0b" stroke-width="10" stroke-linecap="round"/>
    <line x1="0" y1="150" x2="0" y2="190" stroke="#f59e0b" stroke-width="10" stroke-linecap="round"/>
    <line x1="35" y1="145" x2="35" y2="185" stroke="#f59e0b" stroke-width="10" stroke-linecap="round"/>
    <line x1="70" y1="135" x2="70" y2="175" stroke="#f59e0b" stroke-width="10" stroke-linecap="round"/>
  </g>
</svg>
